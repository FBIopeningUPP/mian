<!DOCTYPE html>
<html>
<head>
    <title>Simple Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form">
        <h2>Registration Form</h2>

        <form>
            <label>Name</label>
            <input type="text">

            <label>Email</label>
            <input type="email">

            <label>Password</label>
            <input type="password">

            <label>Gender</label>
            <div>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </div>

            <label>Course</label>
            <select>
                <option>BCA</option>
                <option>BBA</option>
                <option>B.Tech</option>
            </select>

            <label>Message</label>
            <textarea rows="4"></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
